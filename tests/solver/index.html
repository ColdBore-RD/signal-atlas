<!doctype html>
<meta charset="utf-8">
<title>Signal Atlas wave solver tests</title>
<body style="font: 14px monospace; background: #111; color: #ddd">
<pre id="out">running...</pre>
<script type="module">
  import { runAll } from './solver-tests.js';
  const out = document.getElementById('out');
  try {
    const results = await runAll((line) => { out.textContent += '\n' + line; });
    window.__results = results;
  } catch (e) {
    window.__results = { fatal: String(e && e.stack || e) };
    out.textContent += '\nFATAL ' + e;
  }
</script>
